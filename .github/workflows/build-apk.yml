name: Build Offline Arabic Translator APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g
      JAVA_TOOL_OPTIONS: -Xmx4g

    steps:
      - uses: actions/checkout@v4

      - name: Extract project source
        run: |
          unzip -q OfflineArabicTranslator_Source_v0_3.zip
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/OfflineArabicTranslator" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: OfflineArabicTranslator/tools/requirements-models.txt

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK 34
        run: sdkmanager --install 'platforms;android-34' 'build-tools;34.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Install model-export requirements
        working-directory: OfflineArabicTranslator
        run: python -m pip install -r tools/requirements-models.txt

      - name: Prepare models, test and build APK
        working-directory: OfflineArabicTranslator
        run: python tools/build_unified.py --mode full

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: OfflineArabicTranslator-APK
          path: OfflineArabicTranslator/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 15

      - name: Upload AndroidIDE-ready project
        uses: actions/upload-artifact@v4
        with:
          name: AndroidIDE-Ready-Project
          path: OfflineArabicTranslator/dist/AndroidIDE_Ready_OfflineTranslator.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 15
