name: Build Offline Arabic Translator APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g
      JAVA_TOOL_OPTIONS: -Xmx4g

    steps:
      - uses: actions/checkout@v4

      - name: Rebuild and verify project source
        run: |
          mkdir -p .rebuild
          cat .source_parts/00.b64 .source_parts/01.b64 .source_parts/02.b64 .source_parts/03.b64 .source_parts/04a.b64 .source_parts/04b1.b64 .source_parts/04b2.b64 .source_parts/05.b64 > .rebuild/source.b64
          base64 --decode .rebuild/source.b64 > .rebuild/source.zip
          echo "e7c47f48023489f702a1fdce7993288a2f16e2b7ec890d15b61a166a1bdcc971  .rebuild/source.zip" | sha256sum --check -
          unzip -t .rebuild/source.zip
          unzip -q .rebuild/source.zip
          test -f OfflineArabicTranslator/tools/build_unified.py
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/OfflineArabicTranslator" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: OfflineArabicTranslator/tools/requirements-models.txt

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK 34
        run: sdkmanager --install 'platforms;android-34' 'build-tools;34.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Install model-export requirements
        working-directory: OfflineArabicTranslator
        run: python -m pip install -r tools/requirements-models.txt

      - name: Prepare models, test and build APK
        working-directory: OfflineArabicTranslator
        run: python tools/build_unified.py --mode full

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: OfflineArabicTranslator-APK
          path: OfflineArabicTranslator/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 15

      - name: Upload AndroidIDE-ready project
        uses: actions/upload-artifact@v4
        with:
          name: AndroidIDE-Ready-Project
          path: OfflineArabicTranslator/dist/AndroidIDE_Ready_OfflineTranslator.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 15
